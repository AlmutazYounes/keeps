  body.with-highlights.filters-on #years { top: 300px; }

<body>
<header>
  <a class="brand" href="/">
    <svg class="logo" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
      <rect x="2" y="2" width="16" height="16" rx="3.5" fill="#e53935"></rect>
      <rect x="8" y="8" width="16" height="16" rx="3.5" fill="#1a73e8"></rect>
      <rect x="14" y="14" width="16" height="16" rx="3.5" fill="#f9ab00"></rect>
    </svg>
    <h1 id="title">Keeps</h1>
  </a>

    <a id="tab-videos" href="/videos">Videos</a>
  </nav>
  <nav class="links" aria-label="More">
    <a href="/faces">Faces</a>
    <a href="/categories">Categories</a>
    <a href="/review">Review</a>
    <a href="/settings">Settings</a>
  </nav>
  <div id="count"></div>
  <div class="actions">

</header>
<div id="filterbar">
  <label class="filter">Person
    <select id="filter-person" aria-label="Person"></select>
  </label>
  <label class="filter">Year
    <select id="filter-year" aria-label="Year"></select>
  </label>
  <button id="filter-date" class="ghost" type="button" hidden>Date</button>
  <button id="filter-scope" class="ghost" type="button" hidden>Category</button>
  <button id="filter-photos" class="ghost" type="button">Photos</button>
  <button id="filter-videos" class="ghost" type="button">Videos</button>
  <input id="filter-text" type="search" placeholder="Words" aria-label="Words in the caption or file name" autocomplete="off">
</div>
<div id="memories">
  <button id="mem-prev" class="mem-arrow" type="button" aria-label="Previous memories">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M14.5 6 L9 12 L14.5 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>

  </button>

  <button id="face-clear" type="button">All photos</button>
</div>
<nav id="years"></nav>
<div id="float"></div>
<div id="scroller">
  <div id="status" hidden></div>
  <div id="placeholders" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
  <div id="canvas" hidden>
    <div id="spacer"></div>
    <div id="stage"></div>
  </div>
  <div id="empty">No photos match that search.</div>
</div>
<aside id="scrub" hidden>

  <div id="scrub-thumb"></div>
  <div id="scrub-panel">
    <div id="scrub-years"></div>

<div id="selectbar">

      <button id="lb-delete" type="button">Delete</button>
      <button id="lb-info" type="button" aria-label="Info">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
          <path d="M12 11v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
          <circle cx="12" cy="8" r="1.1" fill="currentColor"></circle>
        </svg>
      </button>
      <button id="lb-close" type="button" aria-label="Close">×</button>
    </div>
  </div>
  <button id="lb-prev" type="button" aria-label="Previous">‹</button>
  <button id="lb-next" type="button" aria-label="Next">›</button>
  <div id="lb-stage">
    <div id="lb-media"></div>
    <div id="lb-box" hidden></div>
  </div>
  <div id="lb-caption"></div>
  <div id="lb-tools">
    <button id="lb-left" type="button">Rotate left</button>
    <button id="lb-right" type="button">Rotate right</button>
    <label>Straighten
      <input id="lb-tilt" type="range" min="-15" max="15" step="0.5" value="0" aria-label="Straighten">
      <span id="lb-tilt-value">0</span>
    </label>
    <button id="lb-crop" type="button" aria-pressed="false">Crop</button>
    <button id="lb-face" type="button">Add face</button>
    <button id="lb-reset" type="button" hidden>Reset</button>
    <button id="lb-copy" type="button" hidden>Save a copy</button>
    <button id="lb-replace" type="button" hidden>Save</button>
    <input id="lb-face-name" type="text" placeholder="Name" maxlength="80" autocomplete="off" hidden>
    <button id="lb-face-save" type="button" hidden>Save face</button>
    <button id="lb-tool-cancel" type="button" hidden>Cancel</button>
    <span id="lb-note"></span>
  </div>
  <aside id="info"></aside>
</div>
<script>
const scroller = document.getElementById("scroller");
const canvas = document.getElementById("canvas");
const spacer = document.getElementById("spacer");
const stage = document.getElementById("stage");
const yearsEl = document.getElementById("years");
const highlightsEl = document.getElementById("highlights");
const memPrev = document.getElementById("mem-prev");
const memNext = document.getElementById("mem-next");
const scrub = document.getElementById("scrub");
const scrubYears = document.getElementById("scrub-years");
const scrubNow = document.getElementById("scrub-now");
const scrubThumb = document.getElementById("scrub-thumb");
const countEl = document.getElementById("count");
const searchEl = document.getElementById("search");
const floatEl = document.getElementById("float");
const emptyEl = document.getElementById("empty");
const statusEl = document.getElementById("status");
const placeholders = document.getElementById("placeholders");
const lb = document.getElementById("lb");
const lbStage = document.getElementById("lb-stage");
const lbMedia = document.getElementById("lb-media");
const lbBox = document.getElementById("lb-box");
const lbCaption = document.getElementById("lb-caption");
const lbName = document.getElementById("lb-name");
const lbNote = document.getElementById("lb-note");
const infoEl = document.getElementById("info");

let captionById = {};
let allGroups = [];
let groups = [];
let selecting = false;
let anchorId = null;
const selectedIds = new Set();
let namedPeople = [];
let flat = [];
let layout = null;
let lastKey = "";
let openIndex = -1;
let frame = 0;
let scrubSig = "";
let scrubTimer = 0;
let scrubHover = false;
let scrubDrag = false;
let infoToken = 0;
let facePersonId = Number(new URLSearchParams(location.search).get("person")) || 0;
const videosOnly = location.pathname === "/videos";
if (videosOnly) {
  document.title = "Videos";
  document.getElementById("tab-photos").classList.remove("on");
  document.getElementById("tab-videos").classList.add("on");
  searchEl.placeholder = "Search videos";
}
function updateMemArrows() {
  const max = highlightsEl.scrollWidth - highlightsEl.clientWidth;
  memPrev.disabled = highlightsEl.scrollLeft <= 2;
  memNext.disabled = max <= 2 || highlightsEl.scrollLeft >= max - 2;
}
memPrev.addEventListener("click", () => {
  highlightsEl.scrollBy({ left: -246, behavior: "smooth" });
});
memNext.addEventListener("click", () => {
  highlightsEl.scrollBy({ left: 246, behavior: "smooth" });
});
highlightsEl.addEventListener("scroll", updateMemArrows);
const themeBtn = document.getElementById("theme");
function paintTheme() {
  const dark = document.documentElement.classList.contains("dark");
  themeBtn.textContent = dark ? "Light" : "Dark";
  themeBtn.setAttribute("aria-label", dark ? "Use light theme" : "Use dark theme");
}
themeBtn.addEventListener("click", () => {
  document.documentElement.classList.toggle("dark");
  localStorage.setItem("photos-theme", document.documentElement.classList.contains("dark") ? "dark" : "light");
  paintTheme();
});
paintTheme();
let extraPerson = null;
let libraryReady = false;
let peopleReady = false;

function escapeText(value) {
  return value.replace(/[&<>]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[ch]));
}

function sourceFor(item, large) {
  const id = item[0];
  const kind = item[2];
  if (!large) return "/thumb/" + id;
  if (kind === "video") return "/media/" + id;
  if (kind === "convert") return "/view/" + id;
  return "/media/" + id;
}

function applyGroups(next) {
  groups = next;
  flat = [];
  groups.forEach((group) => {
    group.items.forEach((item) => {
      flat.push({ item, label: group.label });
    });
  });
  lastKey = "";
  layoutNow();
}

function layoutNow() {
  const width = Math.max(280, scroller.clientWidth - 32);
  const gap = 3;
  const cols = Math.max(2, Math.floor((width + gap) / 188));
  const cell = Math.floor((width - gap * (cols - 1)) / cols);
  const header = 40;
  let y = 12;
  const blocks = groups.map((group) => {
    const rows = Math.ceil(group.items.length / cols);
    const top = y;
    const height = header + rows * cell + Math.max(0, rows - 1) * gap + 18;
    y += height;
    return { group, top, height, rows, cols, cell, header };
  });
  layout = { width, gap, cols, cell, header, total: y + 24, blocks };
  spacer.style.height = layout.total + "px";
  canvas.hidden = groups.length === 0;
  emptyEl.style.display = groups.length === 0 ? "block" : "none";
  render();
}

function render() {
  if (!layout) return;
  const scroll = scroller.scrollTop;
  const view = scroller.clientHeight;
  const parts = [];
  const ids = [];
  let label = groups.length ? groups[0].label : "";
  let year = groups.length ? groups[0].year : "";
  for (const block of layout.blocks) {
    if (block.top <= scroll + 8) {
      label = block.group.label;
      year = block.group.year;
    }
    if (block.top + block.height < scroll - 500) continue;
    if (block.top > scroll + view + 700) break;
    if (block.top > scroll + 8) {
      parts.push(
        `<div class="month" style="top:${block.top}px">${escapeText(block.group.label)}<span>${block.group.items.length.toLocaleString()}</span></div>`
      );
    }
    const rowH = block.cell + layout.gap;
    const startRow = Math.max(0, Math.floor((scroll - 700 - (block.top + block.header)) / rowH));
    const endRow = Math.min(block.rows, Math.ceil((scroll + view + 700 - (block.top + block.header)) / rowH));
    for (let row = startRow; row < endRow; row++) {
      for (let col = 0; col < block.cols; col++) {
        const index = row * block.cols + col;
        if (index >= block.group.items.length) break;
        const item = block.group.items[index];
        const x = 16 + col * (block.cell + layout.gap);
        const y = block.top + block.header + row * rowH;
        ids.push(item[0]);
        const badge = item[2] === "video" ? `<span class="badge"></span>` : "";
        const picked = selectedIds.has(item[0]) ? " picked" : "";
        parts.push(
          `<button class="cell${picked}" data-id="${item[0]}" style="transform:translate(${x}px,${y}px);width:${block.cell}px;height:${block.cell}px"><img data-src="${sourceFor(item, false)}" alt=""><span class="tick" aria-label="Select photo"></span>${badge}</button>`
        );
      }
    }
  }
  const key = ids.join(",");
  const active = layout.blocks.find((block) => block.group.label === label);
  floatEl.textContent = label;
  floatEl.style.visibility = active && active.top < scroll - 4 ? "visible" : "hidden";
  syncScrub(label, year);
  if (key !== lastKey) {
    lastKey = key;
    stage.innerHTML = parts.join("");
    document.querySelectorAll("#years button").forEach((button) => {
      button.classList.toggle("active", button.dataset.label === label || label.endsWith(button.dataset.year));
    });
  }
  loadVisibleThumbs();
}

function cellTop(cell) {
  const match = /translate\(([-\d.]+)px,\s*([-\d.]+)px\)/.exec(cell.style.transform || "");
  return match ? Number(match[2]) : 0;
}

function loadVisibleThumbs() {
  if (!layout) return;
  const scroll = scroller.scrollTop;
  const view = scroller.clientHeight;
  const start = scroll - 200;
  const end = scroll + view + 200;
  stage.querySelectorAll(".cell img").forEach((img) => {
    const cell = img.parentElement;
    const y = cellTop(cell);
    const height = cell.offsetHeight || layout.cell || 160;
    const near = y + height >= start && y <= end;
    const url = img.dataset.src || "";
    if (!url) return;
    if (!near) {
      if (img.getAttribute("src") && !(img.complete && img.naturalWidth > 0)) {
        img.removeAttribute("src");
        img.dataset.next = "0";
      }
      return;
    }
    if (img.getAttribute("src")) {
      if (!img.complete) return;
      if (img.naturalWidth > 0) return;
      if (Date.now() < Number(img.dataset.next || 0)) return;
    }
    const tries = Number(img.dataset.tries || 0);
    if (tries >= 4) return;
    img.dataset.tries = String(tries + 1);
    img.dataset.next = String(Date.now() + 500);
    img.src = tries ? url + "?r=" + tries : url;
  });
}

const SCRUB_MONTHS = {
  January: "Jan", February: "Feb", March: "Mar", April: "Apr",
  May: "May", June: "Jun", July: "Jul", August: "Aug",
  September: "Sep", October: "Oct", November: "Nov", December: "Dec",
  Jan: "Jan", Feb: "Feb", Mar: "Mar", Apr: "Apr", Jun: "Jun",
  Jul: "Jul", Aug: "Aug", Sep: "Sep", Oct: "Oct", Nov: "Nov", Dec: "Dec",
};

function scrubCaption(label, year) {
  const parts = String(label || "").split(/[\s,]+/).filter(Boolean);
  let month = "";
  let foundYear = year || "";
  parts.forEach((part) => {
    if (SCRUB_MONTHS[part]) month = SCRUB_MONTHS[part];
    if (/^\d{4}$/.test(part)) foundYear = part;
  });
  if (label && label.startsWith("Undated")) return label;
  if (month && foundYear && foundYear !== "Unknown") return month + " " + foundYear;
  return foundYear || label || "";
}

function openScrub() {
  document.body.classList.add("scrub-open");
  clearTimeout(scrubTimer);
  scrubTimer = setTimeout(() => {
    if (!scrubHover && !scrubDrag) document.body.classList.remove("scrub-open");
  }, 800);
}

function syncScrub(label, year) {
  if (!layout || !layout.blocks.length) {
    scrub.hidden = true;
    return;
  }
  scrub.hidden = false;
  const total = Math.max(1, layout.total);
  const maxScroll = Math.max(1, scroller.scrollHeight - scroller.clientHeight);
  const ratio = Math.min(1, Math.max(0, scroller.scrollTop / maxScroll));
  const marks = [];
  let seen = "";
  layout.blocks.forEach((block) => {
    if (block.group.year === seen) return;
    seen = block.group.year;
    marks.push({ year: block.group.year, at: block.top / total });
  });
  const height = Math.max(1, scrub.clientHeight);
  const pad = 28;
  const yFor = (at) => Math.min(height - pad, Math.max(pad, at * height));
  const sig = height + "|" + marks.map((mark) => mark.year + "@" + Math.round(mark.at * 10000)).join("|");
  if (sig !== scrubSig) {
    scrubSig = sig;
    scrubYears.innerHTML = marks.map((mark) =>
      `<button type="button" class="scrub-year" data-year="${escapeText(mark.year)}" style="top:${yFor(mark.at)}px">${escapeText(mark.year)}</button>`
    ).join("");
  }
  const nowPx = yFor(ratio);
  scrubNow.textContent = scrubCaption(label, year);
  scrubNow.style.top = nowPx + "px";
  scrubYears.querySelectorAll(".scrub-year").forEach((button) => {
    const y = parseFloat(button.style.top);
    button.classList.toggle("near", Math.abs(y - nowPx) < 18);
  });
  const travel = Math.max(0, height - 80);
  scrubThumb.style.top = (8 + ratio * travel) + "px";
}

function scrubSeek(event) {
  const rect = scrub.getBoundingClientRect();
  const ratio = Math.min(1, Math.max(0, (event.clientY - rect.top) / Math.max(1, rect.height)));
  const maxScroll = scroller.scrollHeight - scroller.clientHeight;
  scroller.scrollTop = ratio * Math.max(0, maxScroll);
}

function scrollToYear(year) {
  const block = layout.blocks.find((entry) => entry.group.year === year);
  if (!block) return;
  scroller.scrollTop = block.top;
}

function buildYears(source) {
  const seen = [];
  (source || allGroups).forEach((group) => {
    if (!seen.includes(group.year)) seen.push(group.year);
  });
  yearsEl.innerHTML = seen.map((year) => `<button type="button" data-year="${year}">${year}</button>`).join("");
}

function node(tag, className, text) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (text != null) element.textContent = text;
  return element;
}

function addDetail(parent, title, sub) {
  if (!title && !sub) return;
  const block = node("div", "detail");
  if (title) block.appendChild(node("b", "", title));
  if (sub) block.appendChild(node("span", "", sub));
  parent.appendChild(block);
}

function renderInfo(data) {
  infoEl.replaceChildren();
  const top = node("div", "info-top");
  const close = node("button", "", "×");
  close.type = "button";
  close.setAttribute("aria-label", "Close info");
  close.addEventListener("click", closeInfo);
  top.appendChild(close);
  top.appendChild(node("h2", "", "Info"));
  infoEl.appendChild(top);
  if (data.description) infoEl.appendChild(node("p", "lead", data.description));
  if (data.people && data.people.length) {
    infoEl.appendChild(node("h3", "", "People"));
    const row = node("div", "person-row");
    data.people.forEach((person) => {
      const card = document.createElement("a");
      card.className = "person";
      card.href = "/?person=" + person.id;
      const image = document.createElement("img");
      image.src = "/face-box/" + person.face_id;
      image.alt = person.name || "Unnamed";
      card.appendChild(image);
      card.appendChild(node("span", "", person.name || "Unnamed"));
      row.appendChild(card);
    });
    infoEl.appendChild(row);
  }
  infoEl.appendChild(node("h3", "", "Details"));
  addDetail(infoEl, data.date, data.when);
  addDetail(infoEl, data.camera, data.exposure);
  const fileLine = [data.pixels, data.dimensions, data.hdr].filter(Boolean).join("  ");
  addDetail(infoEl, data.name, fileLine);
  const extra = [data.duration, data.codecs, data.size].filter(Boolean).join("  ");
  addDetail(infoEl, extra, data.folder);
  if (data.software) addDetail(infoEl, data.software, "");
  if (data.altitude) addDetail(infoEl, data.altitude, "Altitude");
  if (data.latitude == null || data.longitude == null) return;
  infoEl.appendChild(node("h3", "", "Location"));
  if (data.place) infoEl.appendChild(node("div", "place", data.place));
  const pad = 0.012;
  const bbox = [
    data.longitude - pad, data.latitude - pad,
    data.longitude + pad, data.latitude + pad,
  ].join(",");
  const frame = document.createElement("iframe");
  frame.title = "Map";
  frame.src = "https://www.openstreetmap.org/export/embed.html?bbox="
    + encodeURIComponent(bbox)
    + "&layer=mapnik&marker="
    + encodeURIComponent(data.latitude + "," + data.longitude);
  infoEl.appendChild(frame);
}

function loadInfo(id) {
  const token = ++infoToken;
  infoEl.replaceChildren(node("p", "info-note", "Reading info..."));
  fetch("/api/info/" + id)
    .then((response) => {
      if (!response.ok) throw new Error("missing");
      return response.json();
    })
    .then((data) => {
      if (token !== infoToken) return;
      renderInfo(data);
    })
    .catch(() => {
      if (token !== infoToken) return;
      infoEl.replaceChildren(node("p", "info-note", "Couldn't read info for this photo."));
    });
}

function closeInfo() {
  lb.classList.remove("info-open");
  infoToken += 1;
}

function openInfo() {
  if (openIndex < 0) return;
  lb.classList.add("info-open");
  loadInfo(flat[openIndex].item[0]);
}

const edit = { turns: 0, straighten: 0, crop: null };
let tool = "";
let draw = null;

function editDirty() {
  return edit.turns !== 0 || edit.straighten !== 0 || edit.crop !== null;
}

function resetEdit() {
  edit.turns = 0;
  edit.straighten = 0;
  edit.crop = null;
  edit.faceBox = null;
  tool = "";
  draw = null;
  const tilt = document.getElementById("lb-tilt");
  if (tilt) tilt.value = "0";
  document.getElementById("lb-tilt-value").textContent = "0";
  lbBox.hidden = true;
  lbNote.textContent = "";
  paintTools();
  fitEdit();
}

function paintTools() {
  const dirty = editDirty();
  const face = tool === "face";
  document.getElementById("lb-reset").hidden = !dirty || face;
  document.getElementById("lb-copy").hidden = !dirty || face;
  document.getElementById("lb-replace").hidden = !dirty || face;
  document.getElementById("lb-face-name").hidden = !face;
  document.getElementById("lb-face-save").hidden = !face;
  document.getElementById("lb-tool-cancel").hidden = !tool;
  document.getElementById("lb-crop").setAttribute("aria-pressed", tool === "crop" ? "true" : "false");
  ["lb-left", "lb-right", "lb-crop", "lb-face", "lb-tilt"].forEach((id) => {
    document.getElementById(id).disabled = face;
  });
}

function fitEdit() {
  const img = lbMedia.querySelector("img");
  if (!img) return;
  const deg = edit.turns * 90 + edit.straighten;
  const swapped = edit.turns % 2 === 1;
  let scale = 1;
  if (swapped && img.offsetWidth && img.offsetHeight) {
    const bounds = lbStage.getBoundingClientRect();
    scale = Math.min(bounds.width / img.offsetHeight, bounds.height / img.offsetWidth, 1);
  }
  img.style.transform = "rotate(" + deg + "deg) scale(" + scale + ")";
}

function currentItem() {
  if (openIndex < 0) return null;
  return flat[openIndex].item;
}

function openAt(id) {
  const index = flat.findIndex((entry) => entry.item[0] === id);
  if (index < 0) return;
  openIndex = index;
  const item = flat[index].item;
  lb.classList.add("open");
  lb.classList.toggle("still", item[2] !== "video");
  lbName.textContent = item[1];
  lbCaption.textContent = captionById[item[0]] || "";
  resetEdit();
  if (item[2] === "video") {
    lbMedia.innerHTML = `<video src="${sourceFor(item, true)}" controls autoplay></video>`;
  } else {
    const img = document.createElement("img");
    img.alt = "";
    img.src = sourceFor(item, true);
    img.addEventListener("load", fitEdit);
    lbMedia.replaceChildren(img);
  }
  if (lb.classList.contains("info-open")) loadInfo(item[0]);
}

function insertCopy(data) {
  const openId = currentItem() ? currentItem()[0] : 0;
  let group = allGroups.find((entry) => entry.year === data.year && entry.month === data.month);
  if (!group) {
    group = { year: data.year, month: data.month, label: data.label, items: [] };
    allGroups.unshift(group);
  }
  group.items.unshift(data.item);
  applyView();
  const index = flat.findIndex((entry) => entry.item[0] === openId);
  if (index >= 0) openIndex = index;
}

function postEdit(mode) {
  const item = currentItem();
  if (!item || !editDirty()) return;
  if (mode === "replace" && !window.confirm("Replace this photo? This overwrites the original file.")) return;
  lbNote.textContent = "Saving";
  document.getElementById("lb-copy").disabled = true;
  document.getElementById("lb-replace").disabled = true;
  fetch("/api/edit", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      id: item[0],
      mode: mode,
      turns: edit.turns,
      straighten: edit.straighten,
      crop: edit.crop,
    }),
  }).then((response) => {
    if (!response.ok) throw new Error("save failed");
    return response.json();
  }).then((data) => {
    if (!data.replaced) insertCopy(data);
    const stamp = "?v=" + Date.now();
    resetEdit();
    if (data.replaced) {
      const img = document.createElement("img");
      img.alt = "";
      img.src = sourceFor(item, true) + stamp;
      img.addEventListener("load", fitEdit);
      lbMedia.replaceChildren(img);
      lbNote.textContent = "Saved";
    } else {
      lbNote.textContent = "Saved a copy";
    }
  }).catch(() => {
    paintTools();
    lbNote.textContent = "Couldn't save that photo.";
  });
}

function saveFace() {
  const item = currentItem();
  if (!item || !edit.faceBox) {
    lbNote.textContent = "Draw a box around the face first.";
    return;
  }
  const name = document.getElementById("lb-face-name").value.trim();
  lbNote.textContent = "Saving";
  document.getElementById("lb-face-save").disabled = true;
  fetch("/api/faces", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: item[0], name: name, box: edit.faceBox }),
  }).then((response) => {
    if (!response.ok) throw new Error("save failed");
    return response.json();
  }).then((data) => {
    tool = "";
    edit.faceBox = null;
    lbBox.hidden = true;
    paintTools();
    lbNote.textContent = data.merged_into
      ? "That name already existed, so this face joined that person."
      : "Saved that face.";
    if (lb.classList.contains("info-open")) loadInfo(item[0]);
  }).catch(() => {
    paintTools();
    lbNote.textContent = "Couldn't save that face.";
  });
}

function fractionBox(start, now) {
  const x = Math.min(start.x, now.x);
  const y = Math.min(start.y, now.y);
  return { x: x, y: y, w: Math.abs(now.x - start.x), h: Math.abs(now.y - start.y) };
}

function imageBounds() {
  const img = lbMedia.querySelector("img");
  if (!img) return null;
  const rect = img.getBoundingClientRect();
  if (!rect.width || !rect.height) return null;
  return rect;
}

function showFraction(box, rect) {
  const stage = lbStage.getBoundingClientRect();
  lbBox.hidden = false;
  lbBox.style.left = (rect.left - stage.left + box.x * rect.width) + "px";
  lbBox.style.top = (rect.top - stage.top + box.y * rect.height) + "px";
  lbBox.style.width = (box.w * rect.width) + "px";
  lbBox.style.height = (box.h * rect.height) + "px";
}

function closeLb() {
  lb.classList.remove("open");
  closeInfo();
  lbMedia.replaceChildren();
  resetEdit();
  openIndex = -1;
}

function step(delta) {
  if (openIndex < 0) return;
  if (editDirty() && !window.confirm("Leave this photo without saving the edit?")) return;
  const next = openIndex + delta;
  if (next < 0 || next >= flat.length) return;
  openAt(flat[next].item[0]);
}

function idsInRange(ids, anchor, target) {
  const startAt = ids.indexOf(anchor);
  const endAt = ids.indexOf(target);
  if (startAt < 0 || endAt < 0) return [target];
  const start = Math.min(startAt, endAt);

async function shareIds(ids) {
  const files = [];
  for (const id of ids) {
    const item = itemById(id);
    if (!item) continue;
    const response = await fetch("/media/" + id);
    if (!response.ok) throw new Error("missing");
    const blob = await response.blob();
    const type = blob.type || (item[2] === "video" ? "video/mp4" : "image/jpeg");
    files.push(new File([blob], item[1], { type }));
  }
  if (!files.length) return;
  if (navigator.canShare && navigator.canShare({ files })) {
    await navigator.share({ files });
    return;
  }
  files.forEach((file) => {
    const link = document.createElement("a");
    link.href = URL.createObjectURL(file);
    link.download = file.name;
    link.click();
    URL.revokeObjectURL(link.href);
  });
}

  });
  if (!response.ok) throw new Error("delete failed");
  const data = await response.json();
  forgetIds(data.removed || []);
}

function dayLabel(iso) {
  const parts = iso.split("-");
  const year = Number(parts[0]);
  const month = Number(parts[1]);
  const day = Number(parts[2]);
  const date = new Date(year, month - 1, day);
  const week = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][date.getDay()];
  const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const head = week + ", " + months[month - 1] + " " + day;
  if (year === new Date().getFullYear()) return head;
  return head + ", " + year;
}

          items: [],
        };
        next.push(current);
      }
      current.items.push(item);
    });
  });
  return next;
}

const YEAR_MIN = 2009;
const YEAR_MAX = 2026;
const MONTH_ALT = "january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|jun|jul|aug|sept|sep|oct|nov|dec";
const MONTHS = {
  january: 1, jan: 1, february: 2, feb: 2, march: 3, mar: 3, april: 4, apr: 4, may: 5,
  june: 6, jun: 6, july: 7, jul: 7, august: 8, aug: 8, september: 9, sept: 9, sep: 9,
  october: 10, oct: 10, november: 11, nov: 11, december: 12, dec: 12,
};
const MONTH_LABELS = ["", "January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const STOPWORDS = new Set(["a", "an", "the", "in", "on", "at", "of", "for", "to", "and", "or", "with", "from", "by", "as", "is", "it", "my", "our", "their", "this", "that", "these", "those", "into", "onto", "during", "some", "just", "very", "wearing", "wear", "wears", "wore", "be", "was", "were", "am", "are", "his", "her", "its", "me"]);
const VIDEO_WORDS = new Set(["video", "videos"]);
const CATEGORY_WORDS = {
  screenshot: "screenshot", screenshots: "screenshot",
  document: "document", documents: "document",
  animal: "animal", animals: "animal",
  food: "food",
  nature: "nature",
  vehicle: "vehicle", vehicles: "vehicle",
};
const CATEGORY_LABELS = {
  screenshot: "Screenshots", document: "Documents", animal: "Animals",
  food: "Food", nature: "Nature", vehicle: "Vehicles",
};
const PHOTO_WORDS = new Set(["photo", "photos", "picture", "pictures"]);

let kindsById = {};

function normCategory(value) {
  const word = String(value || "").toLowerCase();

}

function emptyFilters() {
  return { person: "", people: [], place: "", category: "", year: null, month: null, day: null, kind: "", words: [], text: "" };
}

function escapeReg(value) {
  return String(value).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function peopleForParse() {
  const list = namedPeople.slice();
  if (extraPerson && extraPerson.name && !list.some((person) => person.id === extraPerson.id)) list.push(extraPerson);

function personNames(people) {
  const found = [];
  const seen = new Set();
  (people || []).forEach((person) => {
    const name = String((person && person.name) || person || "").trim();
    const key = name.toLowerCase();
    if (!name || seen.has(key)) return;
    seen.add(key);
    found.push(name);
  });
  found.sort((a, b) => b.length - a.length);
  return found;
}

function markSpan(consumed, start, end) {
  for (let i = start; i < end; i++) consumed[i] = true;
}

function spanTaken(consumed, start, end) {
  for (let i = start; i < end; i++) if (consumed[i]) return true;
  return false;
}

function validDate(year, month, day) {
  if (year < YEAR_MIN || year > YEAR_MAX) return false;
  if (month == null && day == null) return true;
  if (month < 1 || month > 12) return false;
  if (day == null) return true;
  const probe = new Date(Date.UTC(year, month - 1, day));
  return probe.getUTCFullYear() === year && probe.getUTCMonth() === month - 1 && probe.getUTCDate() === day;
}

function dayNumber(word) {
  const ordinal = /^(\d{1,2})(?:st|nd|rd|th)$/.exec(word);
  const raw = ordinal ? ordinal[1] : (word.length <= 2 && /^\d+$/.test(word) ? word : "");
  if (!raw) return null;
  const number = Number(raw);
  if (number < 1 || number > 31) return null;
  return number;
}

function beside(text, left, right) {
  const first = left.start <= right.start ? left : right;
  const second = left.start <= right.start ? right : left;
  return !/[a-z0-9]/.test(text.slice(first.end, second.start));
}

function readDate(lower, consumed) {
  const patterns = [
    { re: new RegExp("\\b(" + MONTH_ALT + ")\\s+(\\d{1,2})(?:st|nd|rd|th)?\\s*,?\\s*(20\\d{2})\\b", "g"), kind: "mdy" },
    { re: new RegExp("\\b(\\d{1,2})(?:st|nd|rd|th)?\\s+(" + MONTH_ALT + ")\\s+(20\\d{2})\\b", "g"), kind: "dmy" },
  ];
  for (const entry of patterns) {
    let match;
    while ((match = entry.re.exec(lower))) {
      const start = match.index;
      const end = start + match[0].length;
      if (spanTaken(consumed, start, end)) continue;
      const month = MONTHS[entry.kind === "mdy" ? match[1] : match[2]];
      const day = Number(entry.kind === "mdy" ? match[2] : match[1]);
      const year = Number(match[3]);
      if (!validDate(year, month, day)) continue;
      markSpan(consumed, start, end);
      return { year, month, day };
    }
  }
  const months = [];
  const years = [];
  const days = [];
  const wordRe = /[a-z0-9]+/g;
  let match;
  while ((match = wordRe.exec(lower))) {
    const end = match.index + match[0].length;
    if (spanTaken(consumed, match.index, end)) continue;
    const word = match[0];
    if (MONTHS[word]) {
      months.push({ start: match.index, end, value: MONTHS[word] });
      continue;
    }
    if (/^20\d{2}$/.test(word)) {
      const year = Number(word);
      if (year >= YEAR_MIN && year <= YEAR_MAX) years.push({ start: match.index, end, value: year });
      continue;
    }
    const day = dayNumber(word);
    if (day != null) days.push({ start: match.index, end, value: day });
  }
  if (!months.length && !years.length) return { year: null, month: null, day: null };
  const monthHit = months[0] || null;
  const yearHit = years[0] || null;
  let dayHit = null;
  let rejectedDay = null;
  if (monthHit) {
    const candidate = days.find((item) => beside(lower, monthHit, item)) || null;
    if (candidate && validDate(yearHit ? yearHit.value : 2024, monthHit.value, candidate.value)) dayHit = candidate;
    else rejectedDay = candidate;
  }
  if (monthHit) markSpan(consumed, monthHit.start, monthHit.end);
  if (yearHit) markSpan(consumed, yearHit.start, yearHit.end);
  if (dayHit) markSpan(consumed, dayHit.start, dayHit.end);
  if (rejectedDay) markSpan(consumed, rejectedDay.start, rejectedDay.end);
  return {
    year: yearHit ? yearHit.value : null,
    month: monthHit ? monthHit.value : null,
    day: dayHit ? dayHit.value : null,
  };
}

function parseQuery(text, people, places) {
  const lower = String(text || "").toLowerCase();
  const consumed = new Array(lower.length).fill(false);
  const found = [];
  personNames(people).forEach((name) => {
    const pattern = new RegExp("(?<![a-z0-9])" + escapeReg(name.toLowerCase()) + "(?![a-z0-9])", "g");
    let match;
    while ((match = pattern.exec(lower))) {
      const end = match.index + match[0].length;
      if (spanTaken(consumed, match.index, end)) continue;
      markSpan(consumed, match.index, end);
      found.push({ at: match.index, name: name });
      break;
    }
  });
  found.sort((a, b) => a.at - b.at);
  const matched = found.map((item) => item.name);
  const place = readPlace(lower, consumed, places);
  const category = readCategory(lower, consumed);
  const when = readDate(lower, consumed);
  const year = when.year;
  const month = when.month;
  const day = when.day;
  let kind = "";
  const mediaSpans = [];
  const wordRe = /[a-z0-9]+/g;
  let match;
  while ((match = wordRe.exec(lower))) {
    const end = match.index + match[0].length;
    if (spanTaken(consumed, match.index, end)) continue;
    if (VIDEO_WORDS.has(match[0])) {
      kind = "video";
      mediaSpans.push([match.index, end]);
    } else if (PHOTO_WORDS.has(match[0])) {
      kind = "photo";
      mediaSpans.push([match.index, end]);
    }
  }
  mediaSpans.forEach((span) => markSpan(consumed, span[0], span[1]));
  const words = [];
  const seen = new Set();
  wordRe.lastIndex = 0;
  while ((match = wordRe.exec(lower))) {
    const end = match.index + match[0].length;
    if (spanTaken(consumed, match.index, end)) continue;
    const word = match[0];
    if (STOPWORDS.has(word) || VIDEO_WORDS.has(word) || PHOTO_WORDS.has(word) || seen.has(word)) continue;
    seen.add(word);
    words.push(word);
  }
  return {
    person: matched[0] || "",
    people: matched,
    place: place,
    category: category,
    year: year,
    month: month,
    day: day,
    kind: kind,
    words: words,
    text: words.join(" "),
  };
}

function readPlace(lower, consumed, places) {
  const ranked = [];
  (places || []).forEach((label) => {
    const text = String(label || "").trim();
    if (!text) return;
    const names = [text];
    const city = text.split(",")[0].trim();
    if (city && city.toLowerCase() !== text.toLowerCase()) names.push(city);
    names.forEach((name) => ranked.push({ length: name.length, folded: name.toLowerCase(), label: text }));
  });
  ranked.sort((a, b) => b.length - a.length);
  for (let i = 0; i < ranked.length; i++) {
    const pattern = new RegExp("(?<![a-z0-9])" + escapeReg(ranked[i].folded) + "(?![a-z0-9])");
    const match = pattern.exec(lower);
    if (!match) continue;
    const end = match.index + match[0].length;
    if (spanTaken(consumed, match.index, end)) continue;
    markSpan(consumed, match.index, end);
    return ranked[i].label;
  }
  return "";
}

function readCategory(lower, consumed) {
  let found = "";
  const spans = [];
  const wordRe = /[a-z0-9]+/g;
  let match;
  while ((match = wordRe.exec(lower))) {
    const end = match.index + match[0].length;
    if (spanTaken(consumed, match.index, end)) continue;
    const kind = CATEGORY_WORDS[match[0]];
    if (!kind) continue;
    if (!found) found = kind;
    spans.push([match.index, end]);
  }
  spans.forEach((span) => markSpan(consumed, span[0], span[1]));
  return found;
}

function contentWords(text) {
  const words = [];
  const seen = new Set();
  const re = /[a-z0-9]+/g;
  const lower = String(text || "").toLowerCase();
  let match;
  while ((match = re.exec(lower))) {
    if (STOPWORDS.has(match[0]) || VIDEO_WORDS.has(match[0]) || PHOTO_WORDS.has(match[0]) || seen.has(match[0])) continue;
    seen.add(match[0]);
    words.push(match[0]);
  }
  return words;
}

function squash(text) {
  return String(text || "").toLowerCase().replace(/[^a-z0-9]/g, "");
}

function nameHasPerson(filename, person) {
  const pattern = new RegExp("(?<![a-z0-9])" + escapeReg(String(person || "").toLowerCase()) + "(?![a-z0-9])");
  return pattern.test(String(filename || "").toLowerCase());
}

function storedParts(item, groupYear, groupMonth) {
  const raw = item[3] || "";
  if (/^\d{4}-\d{2}-\d{2}/.test(raw)) {
    return {
      id: item[0],
      name: item[1],
      kind: item[2],
      year: Number(raw.slice(0, 4)),
      month: Number(raw.slice(5, 7)),
      day: Number(raw.slice(8, 10)),
    };
  }
  const prefix = String(groupMonth || "").slice(0, 2);
  return {
    id: item[0],
    name: item[1],
    kind: item[2],
    year: /^\d{4}$/.test(String(groupYear || "")) ? Number(groupYear) : null,
    month: /^\d{2}$/.test(prefix) ? Number(prefix) : null,
    day: null,
  };
}

function personIdMap() {
  const map = {};
  peopleForParse().forEach((person) => {
    const name = (person.name || "").trim().toLowerCase();
    if (!name) return;
    const ids = new Set();
    (person.ids || []).forEach((id) => {
      ids.add(id);
      if (typeof id === "number") ids.add(String(id));
      if (typeof id === "string" && /^\d+$/.test(id)) ids.add(Number(id));
    });
    map[name] = ids;
  });
  return map;
}

function itemMatches(item, matchFilters, caption, idsByPerson, groupYear, groupMonth) {
  const parts = storedParts(item, groupYear, groupMonth);
  const people = matchFilters.people && matchFilters.people.length ? matchFilters.people : (matchFilters.person ? [matchFilters.person] : []);
  for (let i = 0; i < people.length; i++) {
    const ids = idsByPerson[people[i].toLowerCase()] || new Set();
    if (!ids.has(parts.id) && !nameHasPerson(parts.name, people[i])) return false;
  }
  if (matchFilters.kind === "video" && parts.kind !== "video") return false;
  if (matchFilters.kind === "photo" && parts.kind === "video") return false;
  if (matchFilters.year && parts.year !== matchFilters.year) return false;
  if (matchFilters.month && parts.month !== matchFilters.month) return false;
  if (matchFilters.day && parts.day !== matchFilters.day) return false;
  if (matchFilters.category) {
    const have = kindsById[parts.id] || kindsById[String(parts.id)] || [];
    if (have.indexOf(matchFilters.category) === -1) return false;
  }
  if (matchFilters.place && !placeMatches(placeById[parts.id] || placeById[String(parts.id)] || "", matchFilters.place)) return false;
  const words = matchFilters.words || [];
  const fileSq = squash(parts.name);
  const capSq = squash(caption);
  for (let i = 0; i < words.length; i++) {
    const token = squash(words[i]);
    if (token && fileSq.indexOf(token) === -1 && capSq.indexOf(token) === -1) return false;
  }
  return true;
}

function activeKind() {
  if (filters.kind === "video" || filters.kind === "photo") return filters.kind;
  return videosOnly ? "video" : "";
}

function placeMatches(photoLabel, queryPlace) {
  const photo = String(photoLabel || "").trim().toLowerCase();
  const query = String(queryPlace || "").trim().toLowerCase();
  if (!query) return true;
  if (!photo) return false;
  if (photo === query || photo.indexOf(query + ",") === 0) return true;
  return photo.split(",")[0].trim() === query.split(",")[0].trim();
}

function activeCategory() {
  return filters.category || pinnedCategory || "";
}

function activePlace() {
  return filters.place || pinnedPlace || "";
}

function filtering() {
  return Boolean(
    searchEl.value.trim()
    || filters.person
    || activeCategory()
    || activePlace()
    || filters.year
    || filters.month
    || filters.day
    || filters.kind
    || filters.words.length
  );
}

function searchActive() {
  return filtering();
}

function escapeAttr(value) {
  return escapeText(value).replace(/"/g, "&quot;");
}

function paintFilters() {
  syncing = true;
  const names = [];
  peopleForParse().forEach((person) => {
    const name = (person.name || "").trim();
    if (!name || names.some((item) => item.toLowerCase() === name.toLowerCase())) return;
    names.push(name);
  });
  if (filters.person && !names.some((item) => item.toLowerCase() === filters.person.toLowerCase())) names.push(filters.person);
  personSel.innerHTML = '<option value="">Anyone</option>' + names.map((name) => `<option value="${escapeAttr(name)}">${escapeText(name)}</option>`).join("");
  personSel.value = filters.person || "";
  const years = [];
  allGroups.forEach((group) => {
    if (/^\d{4}$/.test(group.year) && !years.includes(group.year)) years.push(group.year);
  });
  if (filters.year && !years.includes(String(filters.year))) years.push(String(filters.year));
  years.sort((a, b) => Number(b) - Number(a));
  yearSel.innerHTML = '<option value="">Any year</option>' + years.map((year) => `<option value="${year}">${year}</option>`).join("");
  yearSel.value = filters.year ? String(filters.year) : "";
  const scopeBits = [];
  if (CATEGORY_LABELS[activeCategory()]) scopeBits.push(CATEGORY_LABELS[activeCategory()]);
  if (activePlace()) scopeBits.push(activePlace());
  if (scopeBits.length) {
    scopeBtn.hidden = false;
    scopeBtn.textContent = scopeBits.join(", ");
  } else {
    scopeBtn.hidden = true;
  }
  if (filters.month) {
    let label = MONTH_LABELS[filters.month] || "";
    if (filters.day) label += " " + filters.day;
    dateBtn.hidden = false;
    dateBtn.textContent = label;
    dateBtn.setAttribute("aria-label", "Clear " + label);
  } else {
    dateBtn.hidden = true;
  }
  if (document.activeElement !== textEl) textEl.value = filters.text || "";
  photoBtn.classList.toggle("on", filters.kind === "photo");
  videoBtn.classList.toggle("on", filters.kind === "video" || (videosOnly && filters.kind !== "photo"));
  document.body.classList.toggle("filters-on", searchActive());
  syncing = false;
}

let highlightsKey = "";

function renderHighlights() {
  const show = !videosOnly && !facePersonId && !filtering() && allGroups.length;
  if (!show) {
    document.body.classList.remove("with-highlights");
    return;
  }
  const used = new Set();
  const cards = [];
  const today = new Date();
  [1, 2, 3, 4, 5, 6, 7, 8, 10, 12, 15, 20].forEach((ago) => {
    const want = new Date(today.getFullYear() - ago, today.getMonth(), today.getDate());
    let best = null;
    let bestDist = 8;
    allGroups.forEach((group) => {
      if (!group.date || used.has(group.date)) return;
      const parts = group.date.split("-").map(Number);
      const when = new Date(parts[0], parts[1] - 1, parts[2]);
      const dist = Math.abs(when - want) / 86400000;
      if (dist < bestDist) {
        best = group;
        bestDist = dist;
      }
    });
    if (!best) return;
    const item = best.items.find((entry) => entry[2] !== "video") || best.items[0];
    if (!item) return;
    used.add(best.date);
    cards.push({
      date: best.date,
      id: item[0],
      label: ago === 1 ? "1 year ago" : ago + " years ago",
    });
  });
  if (!cards.length) {
    document.body.classList.remove("with-highlights");
    return;
  }
  document.body.classList.add("with-highlights");
  const key = cards.map((card) => card.date).join(",");
  if (key !== highlightsKey) {
    highlightsKey = key;
    highlightsEl.innerHTML = cards.map((card) => `
      <button type="button" class="memory" data-date="${card.date}">
        <img src="/thumb/${card.id}" alt="">
        <span>${escapeText(card.label)}</span>
      </button>
    `).join("");
  }
  requestAnimationFrame(updateMemArrows);
}

function countLabel(total, filtered) {
  const kind = activeKind();
  if (!filtered && !kind) return total.toLocaleString() + " items";
  const noun = kind === "video" ? "video" : "photo";
  const word = total === 1 ? noun : noun + "s";
  return total.toLocaleString() + " " + word;
}

function emptyText(faceOnly) {
  const kind = activeKind();
  if (faceOnly) return kind === "video" ? "No videos for this face." : "No photos for this face.";
  if (kind === "video") return "No videos match that search.";
  return "No photos match that search.";
}

function applyView() {
  if (!libraryReady) return;
  if (facePersonId && !peopleReady) return;
  const person = currentPerson();
  showFaceBar();
  const kind = activeKind();
  const matchFilters = {
    person: filters.person,
    people: filters.people.slice(),
    year: filters.year,
    month: filters.month,
    day: filters.day,
    kind: kind,
    words: filters.words.slice(),
    category: activeCategory(),
    place: activePlace(),
  };
  let faceIds = null;
  if (facePersonId && !matchFilters.people.length) {
    if (!person) {
      applyGroups([]);
      buildYears([]);
      countEl.textContent = countLabel(0, true);
      emptyEl.textContent = emptyText(true);
      renderHighlights();
      document.body.classList.toggle("filters-on", searchActive());
      return;
    }
    if (person.name) {
      matchFilters.person = person.name;
      matchFilters.people = [person.name];
    } else {
      faceIds = new Set(person.ids || []);
    }
  }
  const idsByPerson = personIdMap();
  const source = allGroups.map((group) => ({
    ...group,
    items: group.items.filter((item) => {
      if (faceIds && !faceIds.has(item[0])) return false;
      return itemMatches(item, matchFilters, captionById[item[0]] || "", idsByPerson, group.year, group.month);
    }),
  })).filter((group) => group.items.length);
  const narrowed = Boolean(filtering() || facePersonId);
  emptyEl.textContent = emptyText(facePersonId && !filtering());
  applyGroups(source);
  const total = source.reduce((sum, group) => sum + group.items.length, 0);
  countEl.textContent = countLabel(total, narrowed);
  buildYears(source);
  renderHighlights();
  document.body.classList.toggle("filters-on", searchActive());
}

function loadFacePerson() {
  if (!facePersonId || currentPerson()) {
    applyView();
    return;
  }
  fetch("/api/people/" + facePersonId)
    .then((response) => response.ok ? response.json() : null)
    .then((data) => {
      extraPerson = data;
      if (searchEl.value.trim()) filters = parseQuery(searchEl.value, peopleForParse(), placeNames);
      paintFilters();
      applyView();
    })
    .catch(() => applyView());
}

searchEl.addEventListener("input", () => {
  pinnedCategory = "";
  pinnedPlace = "";
  filters = parseQuery(searchEl.value, peopleForParse(), placeNames);
  paintFilters();
  applyView();
  scroller.scrollTop = 0;
});

personSel.addEventListener("change", () => {
  if (syncing) return;
  filters.person = personSel.value;
  filters.people = filters.person ? [filters.person] : [];
  paintFilters();
  applyView();
  scroller.scrollTop = 0;
});

yearSel.addEventListener("change", () => {
  if (syncing) return;
  filters.year = yearSel.value ? Number(yearSel.value) : null;
  if (filters.year && filters.month && filters.day && !validDate(filters.year, filters.month, filters.day)) filters.day = null;
  paintFilters();
  applyView();
  scroller.scrollTop = 0;
});

dateBtn.addEventListener("click", () => {
  filters.month = null;
  filters.day = null;
  paintFilters();
  applyView();
  scroller.scrollTop = 0;
});

photoBtn.addEventListener("click", () => {
  filters.kind = filters.kind === "photo" ? "" : "photo";
  paintFilters();
  applyView();
  scroller.scrollTop = 0;
});

videoBtn.addEventListener("click", () => {
  filters.kind = filters.kind === "video" ? "" : "video";
  paintFilters();
  applyView();
  scroller.scrollTop = 0;
});

textEl.addEventListener("input", () => {
  if (syncing) return;
  filters.words = contentWords(textEl.value);
  filters.text = filters.words.join(" ");
  applyView();
  scroller.scrollTop = 0;
});

document.getElementById("face-clear").addEventListener("click", () => {
  facePersonId = 0;
  extraPerson = null;
  history.pushState({}, "", videosOnly ? "/videos" : "/");
  applyView();
  scroller.scrollTop = 0;
});

document.getElementById("face-save").addEventListener("click", () => {
  if (!facePersonId) return;
  const button = document.getElementById("face-save");
  const name = document.getElementById("face-name").value.trim();
  button.textContent = "Saving";
  fetch("/api/people/" + facePersonId, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name }),
  }).then((response) => response.json()).then((data) => {
    if (data.merged_into) {
      location.href = "/?person=" + data.merged_into;
      return;
    }
    const person = currentPerson();
    if (person) person.name = data.name || "";
    button.textContent = "Saved";
    setTimeout(() => { button.textContent = "Save"; }, 800);
  }).catch(() => { button.textContent = "Save"; });
});

fetch("/api/people").then((response) => response.json()).then((data) => {
  namedPeople = data.people || [];
  peopleReady = true;
  if (searchEl.value.trim()) filters = parseQuery(searchEl.value, peopleForParse(), placeNames);
  paintFilters();
  loadFacePerson();
}).catch(() => {
  peopleReady = true;
  paintFilters();
  loadFacePerson();
});

scopeBtn.addEventListener("click", () => {
  const category = activeCategory();
  const place = activePlace();
  pinnedCategory = "";
  pinnedPlace = "";
  let text = searchEl.value;
  if (category) text = text.replace(new RegExp("\\b" + category + "s?\\b", "ig"), " ");
  if (place) {
    [place, place.split(",")[0]].forEach((part) => {
      const name = String(part || "").trim();
      if (!name) return;
      text = text.replace(new RegExp("(?<![a-z0-9])" + escapeReg(name) + "(?![a-z0-9])", "ig"), " ");
    });
  }
  searchEl.value = text.replace(/\s+/g, " ").trim();
  filters = parseQuery(searchEl.value, peopleForParse(), placeNames);
  history.replaceState(null, "", location.pathname);
  paintFilters();
  applyView();
});

function loadCategories() {
  fetch("/api/categories")
    .then((response) => response.ok ? response.json() : null)
    .then((data) => {
      if (!data || !data.index) return;
      const nextKinds = data.index.kinds || {};
      const nextPlaces = data.index.places || {};
      const changed = !categoriesLoaded
        || Object.keys(nextKinds).length !== Object.keys(kindsById).length
        || Object.keys(nextPlaces).length !== Object.keys(placeById).length;
      kindsById = nextKinds;
      placeById = nextPlaces;
      placeNames = data.names || [];
      categoriesLoaded = true;
      if (searchEl.value.trim()) filters = parseQuery(searchEl.value, peopleForParse(), placeNames);
      if (changed && (filtering() || searchEl.value.trim())) {
        paintFilters();
        applyView();
      }
      if (!data.geo || !data.geo.done) setTimeout(loadCategories, 3000);
    })
    .catch(() => {});
}
loadCategories();

function loadCaptions() {
  fetch("/api/captions")
    .then((response) => response.ok ? response.json() : null)
    .then((data) => {
      if (!data || !data.by_id) return;
      captionById = data.by_id;
      if (filtering()) applyView();
    })
    .catch(() => {});
}
loadCaptions();
setInterval(loadCaptions, 20000);

fetch("/api/library")
  .then((response) => response.json())
  .then((data) => {
    allGroups = expandDays(data.groups);
    libraryReady = true;
    placeholders.hidden = true;
    statusEl.hidden = true;
    countEl.textContent = data.count.toLocaleString() + " items";
    paintFilters();
    applyView();
  })
  .catch(() => {
    placeholders.hidden = true;
    statusEl.hidden = false;
    statusEl.textContent = "Could not load the library.";
  });
</script>
