<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Categories</title>
<link rel="stylesheet" href="/vendor/leaflet.css">
<script src="/vendor/leaflet.js"></script>
<script src="/vendor/leaflet-heat.js"></script>
<script>
try {
  if (localStorage.getItem("photos-theme") !== "light") document.documentElement.classList.add("dark");
} catch (e) {}
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #fff; --ink: #202124; --muted: #5f6368; --line: #e6e8eb; --chip: #f1f3f4;
    --nav-on: #202124; --nav-on-ink: #fff; --field: #fff; --tile: #f1f3f4;
  }
  html.dark {
    color-scheme: dark;
    --bg: #202124; --ink: #e8eaed; --muted: #9aa0a6; --line: #3c4043; --chip: #303134;
    --nav-on: #e8eaed; --nav-on-ink: #202124; --field: #303134; --tile: #303134;
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); }
  header {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: center; gap: 16px;
    height: 64px; padding: 0 20px; background: var(--bg); border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
  .logo { display: block; flex: none; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.03em; }
  a { color: inherit; text-decoration: none; }
  .nav, button.nav { background: var(--chip); border: 0; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; color: inherit; cursor: pointer; }
  .nav.on { background: var(--nav-on); color: var(--nav-on-ink); }
  #count { color: var(--muted); font-size: 14px; }
  button.nav { margin-left: auto; }
  main { padding: 28px 20px 64px; }
  h2 { font-size: 16px; font-weight: 600; margin: 28px 0 14px; }
  h2:first-child { margin-top: 0; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 18px 12px;
  }
  .card { display: flex; flex-direction: column; color: inherit; }
  .card img, .card .empty {
    width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; background: var(--tile);
  }
  .card .empty { display: block; }
  .card strong { margin-top: 8px; font-size: 14px; font-weight: 500; }
  .card span { margin-top: 2px; color: var(--muted); font-size: 12px; }
  .card:hover strong { text-decoration: underline; }
  .note { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
  .bone { display: flex; flex-direction: column; }
  .bone .block {
    width: 100%; aspect-ratio: 1; border-radius: 12px;
    background: var(--tile);
    box-shadow: 0 1px 3px rgba(0,0,0,.12);
  }
  .bone .line {
    width: 64%; height: 12px; margin-top: 10px; border-radius: 999px;
    background: var(--tile);
  }
  #map {
    height: 520px; border-radius: 16px; background: var(--tile);
    border: 1px solid var(--line); margin-bottom: 18px;
  }
  .leaflet-container { font: inherit; background: var(--tile); }
</style>
</head>
<body>
<header>
  <a class="brand" href="/">
    <svg class="logo" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
      <polygon points="16,3 3,29 16,20.3" fill="#e53935"></polygon>
      <polygon points="29,29 16,3 16,20.3" fill="#1a73e8"></polygon>
      <polygon points="3,29 29,29 16,20.3" fill="#f9ab00"></polygon>
    </svg>
    <h1>Photos</h1>
  </a>
  <a class="nav" href="/">Photos</a>
  <a class="nav" href="/videos">Videos</a>
  <a class="nav" href="/faces">Faces</a>
  <a class="nav on" href="/categories">Categories</a>
  <a class="nav" href="/review">Review</a>
  <a class="nav" href="/settings">Settings</a>
  <div id="count"></div>
  <button id="theme" class="nav" type="button">Light</button>
</header>
<main id="main" aria-hidden="true">
  <div class="grid">
    <div class="bone"><span class="block"></span><span class="line"></span></div>
    <div class="bone"><span class="block"></span><span class="line"></span></div>
    <div class="bone"><span class="block"></span><span class="line"></span></div>
    <div class="bone"><span class="block"></span><span class="line"></span></div>
    <div class="bone"><span class="block"></span><span class="line"></span></div>
    <div class="bone"><span class="block"></span><span class="line"></span></div>
  </div>
</main>
<script>
const main = document.getElementById("main");
const countEl = document.getElementById("count");
const themeBtn = document.getElementById("theme");

function paintTheme() {
  const dark = document.documentElement.classList.contains("dark");
  themeBtn.textContent = dark ? "Light" : "Dark";
}
themeBtn.addEventListener("click", () => {
  document.documentElement.classList.toggle("dark");
  localStorage.setItem("photos-theme", document.documentElement.classList.contains("dark") ? "dark" : "light");
  paintTheme();
  if (tileLayer) tileLayer.setUrl(tileUrl());
});
paintTheme();

function escapeText(value) {
  return String(value).replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}

function card(href, title, count, cover) {
  const photos = Number(count) || 0;
  const picture = cover
    ? `<img src="/thumb/${cover}" alt="">`
    : `<span class="empty"></span>`;
  return `<a class="card" href="${href}">
    ${picture}
    <strong>${escapeText(title)}</strong>
    <span>${photos.toLocaleString()} photo${photos === 1 ? "" : "s"}</span>
  </a>`;
}

const KIND_CARDS = [
  ["screenshots", "Screenshots", "screenshots"],
  ["documents", "Documents", "documents"],
  ["animals", "Animals", "animals"],
  ["food", "Food", "food"],
  ["nature", "Nature", "nature"],
  ["vehicles", "Vehicles", "vehicles"],
];

function kmBetween(aLat, aLon, bLat, bLon) {
  const rad = Math.PI / 180;
  const dLat = (bLat - aLat) * rad;
  const dLon = (bLon - aLon) * rad;
  const arc = Math.sin(dLat / 2) ** 2 + Math.cos(aLat * rad) * Math.cos(bLat * rad) * Math.sin(dLon / 2) ** 2;
  return 6371 * 2 * Math.asin(Math.min(1, Math.sqrt(arc)));
}

function clearMap() {
  if (!mapView) return;
  mapView.remove();
  mapView = null;
  tileLayer = null;
}

function render(data) {
  main.removeAttribute("aria-hidden");
  clearMap();
  const places = data.places || [];
  const named = places.filter((place) => !/^-?\d+\.\d+/.test(place.label));
  const geo = data.geo || {};
  const status = geo.done
    ? ""
    : `<p class="note">Reading saved locations. ${Number(geo.scanned || 0).toLocaleString()} so far.</p>`;
  const kindCards = KIND_CARDS.map(([key, title, query]) => {
    const item = data[key] || { count: 0 };
    return card("/?category=" + query, title, item.count, item.cover);
  }).join("");
  const namedCards = named.map((place) => card("/?place=" + encodeURIComponent(place.label), place.label, place.count, place.cover)).join("");
  main.innerHTML = `
    ${status}
    <h2>Kinds</h2>
    <div class="grid">${kindCards}</div>
    <h2>Places</h2>
    <p class="note">The heat follows how many photos were taken there. Click a spot to open those photos.</p>
    <div id="map"></div>
    ${namedCards ? `<div class="grid">${namedCards}</div>` : ""}
  `;
  const total = KIND_CARDS.reduce((sum, [key]) => sum + ((data[key] && data[key].count) || 0), 0)
    + places.reduce((sum, place) => sum + (place.count || 0), 0);
  countEl.textContent = total.toLocaleString() + " grouped";
  drawMap(data.map || []);
  if (!geo.done) setTimeout(load, 3000);
}

let mapView = null;
let tileLayer = null;

function tileUrl() {
  const dark = document.documentElement.classList.contains("dark");
  return dark
    ? "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png"
    : "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png";
}

function drawMap(points) {
  const node = document.getElementById("map");
  if (!node || !window.L) return;
  if (!points.length) {
    node.outerHTML = `<p class="note">No saved locations yet.</p>`;
    return;
  }
  mapView = L.map(node, { scrollWheelZoom: true });
  node._galleryMap = mapView;
  tileLayer = L.tileLayer(tileUrl(), {
    attribution: "&copy; OpenStreetMap &copy; CARTO",
    maxZoom: 18,
  }).addTo(mapView);
  const heat = points.map((point) => [point.lat, point.lon, point.count]);
  const max = heat.reduce((top, point) => Math.max(top, point[2]), 1);
  L.heatLayer(heat, { radius: 28, blur: 22, max: max, minOpacity: 0.35 }).addTo(mapView);
  const bounds = L.latLngBounds(points.map((point) => [point.lat, point.lon]));
  mapView.fitBounds(bounds.pad(0.2));
  mapView.on("click", (event) => {
    const zoom = mapView.getZoom();
    const limit = 80 / Math.pow(2, Math.max(0, zoom - 5));
    let best = null;
    let bestKm = Infinity;
    points.forEach((point) => {
      const km = kmBetween(event.latlng.lat, event.latlng.lng, point.lat, point.lon);
      if (km < bestKm) {
        best = point;
        bestKm = km;
      }
    });
    if (!best || bestKm > limit) return;
    location.href = "/?place=" + encodeURIComponent(best.label);
  });
}

function load() {
  fetch("/api/categories")
    .then((response) => response.json())
    .then(render)
    .catch(() => {
      main.innerHTML = `<p class="note">Could not load categories.</p>`;
    });
}
load();
</script>
</body>
</html>
