<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review</title>
<script>
try {
  if (localStorage.getItem("photos-theme") !== "light") document.documentElement.classList.add("dark");
} catch (e) {}
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #fff; --ink: #202124; --muted: #5f6368; --line: #e6e8eb; --chip: #f1f3f4;
    --nav-on: #202124; --nav-on-ink: #fff; --tile: #f1f3f4;
  }
  html.dark {
    color-scheme: dark;
    --bg: #202124; --ink: #e8eaed; --muted: #9aa0a6; --line: #3c4043; --chip: #303134;
    --nav-on: #e8eaed; --nav-on-ink: #202124; --tile: #303134;
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); }
  header {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: center; gap: 16px;
    height: 64px; padding: 0 20px; background: var(--bg); border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.03em; }
  a { color: inherit; text-decoration: none; }
  .nav, button.nav { background: var(--chip); border: 0; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; color: inherit; cursor: pointer; }
  .nav.on { background: var(--nav-on); color: var(--nav-on-ink); }
  #theme { margin-left: auto; }
  main { padding: 20px 20px 80px; }
  .lead { color: var(--muted); font-size: 15px; line-height: 1.45; margin: 0 0 16px; max-width: 720px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
  .card { position: relative; border: 0; padding: 0; background: var(--tile); cursor: pointer; text-align: left; color: inherit; }
  .card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .card span { display: block; padding: 8px 10px 10px; font-size: 13px; font-weight: 600; }
  .card.picked { outline: 3px solid #1a73e8; }
  #bar {
    display: none; position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    align-items: center; gap: 8px; padding: 8px 10px 8px 16px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 999px;
    box-shadow: 0 8px 24px rgba(0,0,0,.18);
  }
  body.picking #bar { display: flex; }
</style>
</head>
<body>
<header>
  <a class="brand" href="/">
    <svg class="logo" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
      <polygon points="16,3 3,29 16,20.3" fill="#e53935"></polygon>
      <polygon points="29,29 16,3 16,20.3" fill="#1a73e8"></polygon>
      <polygon points="3,29 29,29 16,20.3" fill="#f9ab00"></polygon>
    </svg>
    <h1>Photos</h1>
  </a>
  <a class="nav" href="/">Photos</a>
  <a class="nav" href="/videos">Videos</a>
  <a class="nav" href="/faces">Faces</a>
  <a class="nav" href="/categories">Categories</a>
  <a class="nav on" href="/review">Review</a>
  <a class="nav" href="/settings">Settings</a>
  <button id="theme" class="nav" type="button">Light</button>
</header>
<main>
  <p class="lead" id="status">Looking for photos that might not be worth keeping...</p>
  <div class="grid" id="grid"></div>
</main>
<div id="bar">
  <span id="count">0 items</span>
  <button id="delete" class="nav" type="button">Delete</button>
  <button id="clear" class="nav" type="button">Clear</button>
</div>
<script>
const themeBtn = document.getElementById("theme");
const statusEl = document.getElementById("status");
const grid = document.getElementById("grid");
const picked = new Set();

function paintTheme() {
  const dark = document.documentElement.classList.contains("dark");
  themeBtn.textContent = dark ? "Light" : "Dark";
}
themeBtn.addEventListener("click", () => {
  document.documentElement.classList.toggle("dark");
  localStorage.setItem("photos-theme", document.documentElement.classList.contains("dark") ? "dark" : "light");
  paintTheme();
});
paintTheme();

function paintBar() {
  document.body.classList.toggle("picking", picked.size > 0);
  document.getElementById("count").textContent = picked.size + (picked.size === 1 ? " item" : " items");
}

function paint(items) {
  grid.innerHTML = "";
  items.forEach((item) => {
    const card = document.createElement("button");
    card.type = "button";
    card.className = "card";
    card.innerHTML = '<img alt=""><span></span>';
    card.querySelector("img").src = "/thumb/" + item.id;
    card.querySelector("span").textContent = item.reason;
    card.addEventListener("click", () => {
      if (picked.has(item.id)) {
        picked.delete(item.id);
        card.classList.remove("picked");
      } else {
        picked.add(item.id);
        card.classList.add("picked");
      }
      paintBar();
    });
    grid.appendChild(card);
  });
}

document.getElementById("clear").addEventListener("click", () => {
  picked.clear();
  grid.querySelectorAll(".card").forEach((card) => card.classList.remove("picked"));
  paintBar();
});

document.getElementById("delete").addEventListener("click", () => {
  const ids = [...picked];
  if (!ids.length) return;
  const noun = ids.length === 1 ? "this photo" : ids.length + " photos";
  if (!window.confirm("Move " + noun + " to Trash?")) return;
  fetch("/api/delete", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ids }),
  }).then((response) => {
    if (!response.ok) throw new Error("delete failed");
    return response.json();
  }).then(() => {
    picked.clear();
    paintBar();
    load();
  }).catch(() => {
    statusEl.textContent = "Couldn't move those photos to Trash.";
  });
});

function load() {
  fetch("/api/candidates").then((response) => response.json()).then((data) => {
    const items = data.items || [];
    statusEl.textContent = items.length
      ? items.length + " photos look disposable. Select any you want to move to Trash. A photo with no description yet is not listed."
      : "No disposable photos in the descriptions saved so far.";
    paint(items);
  }).catch(() => {
    statusEl.textContent = "Couldn't read the review list.";
  });
}
load();
</script>
</body>
</html>
