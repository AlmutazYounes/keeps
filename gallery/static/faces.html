<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faces</title>
<script>
try {
  if (localStorage.getItem("photos-theme") !== "light") document.documentElement.classList.add("dark");
} catch (e) {}
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #fff; --ink: #202124; --muted: #5f6368; --line: #e6e8eb; --chip: #f1f3f4;
    --nav-on: #202124; --nav-on-ink: #fff; --field: #fff; --tile: #f1f3f4;
  }
  html.dark {
    color-scheme: dark;
    --bg: #202124; --ink: #e8eaed; --muted: #9aa0a6; --line: #3c4043; --chip: #303134;
    --nav-on: #e8eaed; --nav-on-ink: #202124; --field: #303134; --tile: #303134;
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); }
  header {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: center; gap: 16px;
    height: 64px; padding: 0 20px; background: var(--bg); border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
  .logo { display: block; flex: none; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.03em; }
  a { color: inherit; text-decoration: none; }
  .nav, button.nav { background: var(--chip); border: 0; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; color: inherit; cursor: pointer; }
  .nav.on { background: var(--nav-on); color: var(--nav-on-ink); }
  #count { color: var(--muted); font-size: 14px; }
  #filter {
    margin-left: auto; border: 0; background: var(--chip); border-radius: 999px;
    padding: 10px 12px; font: inherit; font-size: 14px; width: min(280px, 40vw); color: inherit;
  }
  main {
    padding: 28px 20px 48px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 28px 12px;
  }
  .face {
    position: relative;
    display: flex; flex-direction: column; align-items: center;
    text-align: center; color: inherit;
  }
  .shot { position: relative; width: 128px; height: 128px; }
  .face img {
    width: 128px; height: 128px; border-radius: 50%;
    object-fit: cover; background: var(--tile);
  }
  .pen {
    position: absolute; right: 2px; bottom: 2px; z-index: 1;
    width: 28px; height: 28px; padding: 0;
    display: grid; place-items: center;
    border: 0; border-radius: 50%;
    background: var(--bg); color: var(--ink); cursor: pointer;
    opacity: 0; pointer-events: none;
    box-shadow: 0 1px 4px rgba(0,0,0,.28);
  }
  .face:hover .pen, .face:focus-within .pen { opacity: 1; pointer-events: auto; }
  @media (hover: none) { .pen { opacity: 1; pointer-events: auto; } }
  .face strong { margin-top: 10px; font-size: 14px; font-weight: 500; }
  .face span { margin-top: 2px; color: var(--muted); font-size: 12px; }
  .face:hover strong { text-decoration: underline; }
  .name {
    margin-top: 10px; width: 100%;
    border: 0; border-bottom: 1px solid var(--line);
    background: transparent; color: inherit;
    font: inherit; font-size: 14px; text-align: center; padding: 2px 0;
  }
  #status, #note { padding: 12px 20px; color: var(--muted); }
  #status { padding-top: 40px; }
  .bone { display: flex; flex-direction: column; align-items: center; }
  .bone .round {
    width: 128px; height: 128px; border-radius: 50%;
    background: var(--tile);
    box-shadow: 0 1px 3px rgba(0,0,0,.12);
  }
  .bone .line {
    width: 72px; height: 12px; margin-top: 14px; border-radius: 999px;
    background: var(--tile);
  }
</style>
</head>
<body>
<header>
  <a class="brand" href="/">
    <svg class="logo" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
      <polygon points="16,3 3,29 16,20.3" fill="#e53935"></polygon>
      <polygon points="29,29 16,3 16,20.3" fill="#1a73e8"></polygon>
      <polygon points="3,29 29,29 16,20.3" fill="#f9ab00"></polygon>
    </svg>
    <h1>Photos</h1>
  </a>
  <a class="nav" href="/">Photos</a>
  <a class="nav" href="/videos">Videos</a>
  <a class="nav on" href="/faces">Faces</a>
  <a class="nav" href="/categories">Categories</a>
  <a class="nav" href="/review">Review</a>
  <a class="nav" href="/settings">Settings</a>
  <div id="count"></div>
  <button id="theme" class="nav" type="button">Light</button>
  <input id="filter" type="search" placeholder="Find a name" autocomplete="off">
</header>
<div id="status" hidden></div>
<p id="note" hidden></p>
<main id="grid" aria-hidden="true">
  <div class="bone"><span class="round"></span><span class="line"></span></div>
  <div class="bone"><span class="round"></span><span class="line"></span></div>
  <div class="bone"><span class="round"></span><span class="line"></span></div>
  <div class="bone"><span class="round"></span><span class="line"></span></div>
  <div class="bone"><span class="round"></span><span class="line"></span></div>
  <div class="bone"><span class="round"></span><span class="line"></span></div>
  <div class="bone"><span class="round"></span><span class="line"></span></div>
  <div class="bone"><span class="round"></span><span class="line"></span></div>
  <div class="bone"><span class="round"></span><span class="line"></span></div>
  <div class="bone"><span class="round"></span><span class="line"></span></div>
  <div class="bone"><span class="round"></span><span class="line"></span></div>
  <div class="bone"><span class="round"></span><span class="line"></span></div>
</main>
<script>
const grid = document.getElementById("grid");
const statusEl = document.getElementById("status");
const countEl = document.getElementById("count");
const filterEl = document.getElementById("filter");
const themeBtn = document.getElementById("theme");
function paintTheme() {
  const dark = document.documentElement.classList.contains("dark");
  themeBtn.textContent = dark ? "Light" : "Dark";
}
themeBtn.addEventListener("click", () => {
  document.documentElement.classList.toggle("dark");
  localStorage.setItem("photos-theme", document.documentElement.classList.contains("dark") ? "dark" : "light");
  paintTheme();
});
paintTheme();
let people = [];
let editor = null;
const saving = new Set();
const noteEl = document.getElementById("note");
const PEN = `<button class="pen" type="button" aria-label="Rename"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"></path></svg></button>`;

function escapeText(value) {
  return String(value).replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}

function render(list) {
  grid.innerHTML = list.map((person) => {
    const label = person.name || "Unnamed";
    const photos = Number(person.count) || 0;
    const busy = saving.has(person.id) ? "Saving" : photos.toLocaleString() + " photo" + (photos === 1 ? "" : "s");
    return `<article class="face" data-id="${person.id}">
      <a class="shot" href="/?person=${person.id}">
        <img src="${escapeText(person.cover)}" alt="">
      </a>
      ${PEN}
      <strong>${escapeText(label)}</strong>
      <span>${busy}</span>
    </article>`;
  }).join("");
  grid.hidden = list.length === 0;
  statusEl.hidden = list.length > 0;
  if (!list.length) statusEl.textContent = "No faces match that name.";
}

function applyFilter() {
  const query = filterEl.value.trim().toLowerCase();
  if (!query) {
    render(people);
    return;
  }
  render(people.filter((person) => (person.name || "unnamed").toLowerCase().includes(query)));
}

filterEl.addEventListener("input", () => {
  closeEditor(true);
  applyFilter();
});

function personById(id) {
  return people.find((person) => person.id === id);
}

function closeEditor(save) {
  if (!editor) return;
  const current = editor;
  editor = null;
  const name = current.input.value.trim();
  if (save && name !== current.original) {
    applyFilter();
    postName(current.id, name);
    return;
  }
  applyFilter();
}

function postName(id, name) {
  saving.add(id);
  noteEl.hidden = true;
  applyFilter();
  fetch("/api/people/" + id, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name }),
  }).then((response) => {
    if (!response.ok) throw new Error("save failed");
    return fetch("/api/people");
  }).then((response) => response.json()).then((data) => {
    saving.delete(id);
    people = data.people || [];
    countEl.textContent = people.length.toLocaleString() + " people";
    if (editor) return;
    applyFilter();
  }).catch(() => {
    saving.delete(id);
    noteEl.hidden = false;
    noteEl.textContent = "Couldn't save that name.";
    if (!editor) applyFilter();
  });
}

function openEditor(id) {
  const person = personById(id);
  const card = grid.querySelector('.face[data-id="' + id + '"]');
  if (!person || !card || saving.has(id)) return;
  const strong = card.querySelector("strong");
  const input = document.createElement("input");
  input.className = "name";
  input.type = "text";
  input.maxLength = 80;
  input.autocomplete = "off";
  input.spellcheck = false;
  input.setAttribute("aria-label", "Name");
  input.placeholder = "Name";
  input.value = person.name || "";
  strong.replaceWith(input);
  editor = { id, input, original: person.name || "" };
  input.focus();
  input.select();
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      closeEditor(true);
    } else if (event.key === "Escape") {
      event.preventDefault();
      closeEditor(false);
    }
  });
  input.addEventListener("blur", () => closeEditor(true));
}

grid.addEventListener("mousedown", (event) => {
  if (event.target.closest(".pen")) event.preventDefault();
});

grid.addEventListener("click", (event) => {
  const pen = event.target.closest(".pen");
  if (!pen) return;
  event.preventDefault();
  const id = Number(pen.closest(".face").dataset.id);
  if (editor && editor.id !== id) closeEditor(true);
  if (!editor) openEditor(id);
});

fetch("/api/people")
  .then((response) => response.json())
  .then((data) => {
    people = data.people || [];
    grid.removeAttribute("aria-hidden");
    countEl.textContent = people.length.toLocaleString() + " people";
    if (!people.length) {
      grid.hidden = true;
      grid.innerHTML = "";
      statusEl.hidden = false;
      statusEl.textContent = "No one appears in 10 or more photos yet.";
      return;
    }
    statusEl.hidden = true;
    grid.hidden = false;
    render(people);
  })
  .catch(() => {
    grid.hidden = true;
    statusEl.hidden = false;
    statusEl.textContent = "Could not load faces.";
  });
</script>
</body>
</html>
